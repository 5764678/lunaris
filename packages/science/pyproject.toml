[project]
name = "lunaris-science"
version = "0.1.0"
description = "LUNARIS scientific core: lunar reference constants, coordinate primitives, provenance/evidence model and (future) terrain, geometry, illumination, visibility, energy and scoring computations. No web or network dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "spiceypy>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunaris_science"]
