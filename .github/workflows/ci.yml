name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      # Space-separated dataset ids acquired before the tests (see "Acquire and verify").
      LUNARIS_CI_DATASETS: naif-generic-kernels-lunar lola-ldem-75s-240m
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install workspace (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      # Real datasets the tests need, acquired and SHA-256 verified through the manifests.
      # Append dataset ids to the list; the cache key changes with the list and with any
      # manifest edit, so a stale or tampered cache is never used without re-verification.
      - name: Restore acquired datasets
        uses: actions/cache@v4
        with:
          path: |
            data/kernels
            data/raw
          key: datasets-${{ hashFiles('packages/data/src/lunaris_data/manifests/**') }}-${{ env.LUNARIS_CI_DATASETS }}
      - name: Acquire and verify datasets
        run: |
          for dataset in $LUNARIS_CI_DATASETS; do
            uv run lunaris-data acquire "$dataset"
            uv run lunaris-data verify "$dataset"
          done
      - name: Tests (science, data, API, live-server integration)
        run: uv run pytest
        env:
          # Tests that need a dataset fail instead of skipping when it is missing.
          LUNARIS_REQUIRE_KERNELS: "1"

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint -w @lunaris/web && npm run format:check
      - name: Type check
        run: npm run typecheck --workspaces --if-present
      - name: Unit tests
        run: npm run test:web
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  contracts:
    name: API contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - name: OpenAPI document and generated TypeScript types are up to date
        run: npm run contracts:check

  e2e:
    name: End-to-end (browser)
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - name: Install Chromium for Playwright
        working-directory: apps/web
        # The browser download and the system packages are separate on purpose. The
        # packages come from Ubuntu's servers, which runners could not resolve on
        # 2026-11-11 (three runs failed here before any test started). The runner image
        # already carries the libraries headless Chromium needs, so the package step is
        # time-boxed and allowed to fail; if the browser then cannot start, the test
        # step fails and says so.
        run: |
          npx playwright install chromium
          timeout --kill-after=10 180 npx playwright install-deps chromium \
            || echo "::warning::System packages for Chromium were not installed (package servers unreachable); using the runner image's libraries."
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
